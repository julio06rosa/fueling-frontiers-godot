name: Demonstração da tempestade no Windows
on:
  workflow_dispatch:
  push:
    branches: ['demo/tempestade-professora']
    paths: ['.github/workflows/entrega-windows.yml']
permissions:
  contents: read
jobs:
  exportar:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Godot 4.6.1 e o modelo oficial de distribuição
        shell: pwsh
        run: |
          $base = 'https://github.com/godotengine/godot-builds/releases/download/4.6.1-stable'
          function Baixar($nome, $hash, $destino) {
            curl.exe --fail --location --retry 3 --silent --show-error "$base/$nome" --output $destino
            if ($LASTEXITCODE -ne 0 -or (Get-FileHash $destino).Hash -ne $hash) { throw "Download inválido de $nome" }
          }
          $pasta = "$env:RUNNER_TEMP\godot"
          Baixar 'Godot_v4.6.1-stable_win64.exe.zip' '088da0457e2d1f7f8a45e6d4605a42b756ea33b9ccd75059bdbc01bb31c2b40d' "$env:RUNNER_TEMP\godot.zip"
          Expand-Archive "$env:RUNNER_TEMP\godot.zip" $pasta
          Baixar 'Godot_v4.6.1-stable_export_templates.tpz' 'e6d372afd4fdfaae9571eb5e3568afcd96ce6db9a569244034154faf0ac69875' "$env:RUNNER_TEMP\templates.zip"
          $destino = New-Item -ItemType Directory -Force "$env:APPDATA\Godot\export_templates\4.6.1.stable"
          $zip = [IO.Compression.ZipFile]::OpenRead("$env:RUNNER_TEMP\templates.zip")
          try {
            foreach ($nome in 'windows_release_x86_64.exe','windows_debug_x86_64.exe','version.txt') {
              $item = $zip.GetEntry("templates/$nome")
              [IO.Compression.ZipFileExtensions]::ExtractToFile($item, "$destino\$nome", $true)
            }
          } finally { $zip.Dispose() }
          "GODOT=$pasta\Godot_v4.6.1-stable_win64_console.exe" >> $env:GITHUB_ENV
      - name: Exportar e extrair a distribuição em uma pasta limpa
        shell: pwsh
        run: |
          $pasta = New-Item -ItemType Directory "$env:RUNNER_TEMP\jogo"
          & $env:GODOT --headless --path . --import
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao importar o projeto' }
          & $env:GODOT --headless --path . --export-release 'Windows Desktop' "$pasta\FuelingFrontiers-Tempestade.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao exportar para Windows' }
          Copy-Item .github/INICIAR.txt $pasta
          Compress-Archive "$pasta\*" "$env:RUNNER_TEMP\FuelingFrontiers-Tempestade-Windows-x64.zip"
          Expand-Archive "$env:RUNNER_TEMP\FuelingFrontiers-Tempestade-Windows-x64.zip" "$env:RUNNER_TEMP\teste"
      - name: Abrir diretamente na doca e testar as duas decisões do radar
        shell: pwsh
        run: |
          $pasta = "$env:RUNNER_TEMP\teste"
          function Jogar($etapa, [string[]]$opcoes) {
            $log = "$env:RUNNER_TEMP\$etapa.log"
            $saida = "$env:RUNNER_TEMP\$etapa-out.txt"
            $erros = "$env:RUNNER_TEMP\$etapa-err.txt"
            Write-Output "Iniciando $etapa em $pasta"
            $p = Start-Process "$pasta\FuelingFrontiers-Tempestade.exe" -WorkingDirectory $pasta -ArgumentList ($opcoes + @('--verbose','--log-file',$log)) -RedirectStandardOutput $saida -RedirectStandardError $erros -PassThru
            try {
              if (-not $p.WaitForExit(30000)) {
                $p.Refresh()
                Write-Output "Janela: $($p.MainWindowTitle)"
                $p.Kill()
                throw "Tempo excedido em $etapa"
              }
              if ($p.ExitCode -ne 0) { throw "$etapa encerrou com código $($p.ExitCode)" }
            } finally {
              foreach ($f in $log,$saida,$erros) {
                if (Test-Path $f) { Get-Content $f -Tail 35 }
              }
            }
          }
          $script = "$env:GITHUB_WORKSPACE/.github/validar-tempestade.gd".Replace('\','/')
          Jogar 'doca' @('--headless','--fixed-fps','60','--quit-after','120')
          $menu = Get-Content "$env:RUNNER_TEMP\doca.log" -Raw
          if ($menu -notmatch 'TrialDock.gdc' -or $menu -match '(SCRIPT ERROR|ERROR):') { throw 'O executável não carregou a doca' }
          # O modelo de distribuição inicia a cena principal. O editor da mesma versão
          # permite conduzir as ações do treino sobre os dados contidos no próprio EXE.
          $pacote = "$pasta\FuelingFrontiers-Tempestade.exe"
          Push-Location $pasta
          try {
            & $env:GODOT --headless --fixed-fps 60 --quit-after 2400 --main-pack $pacote --script $script --log-file "$env:RUNNER_TEMP\treino.log"
            if ($LASTEXITCODE -ne 0) { throw "Treino encerrou com código $LASTEXITCODE" }
          } finally { Pop-Location }
          $log = Get-Content "$env:RUNNER_TEMP\treino.log" -Raw
          Write-Output $log
          if ($log -notmatch 'TEMPESTADE_OK' -or $log -match '(SCRIPT ERROR|ERROR):') { throw 'Falha no treino exportado' }
      - uses: actions/upload-artifact@v4
        with:
          name: entrega-windows
          path: ${{ runner.temp }}/FuelingFrontiers-Tempestade-Windows-x64.zip
  publicar:
    needs: exportar
    if: github.ref == 'refs/heads/demo/tempestade-professora'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: entrega-windows
      - name: Publicar o pacote aprovado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create demo-tempestade-0.13.1 --prerelease --latest=false FuelingFrontiers-Tempestade-Windows-x64.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Demonstração da tempestade para Windows" --notes "Demonstração independente. Tecla 1 fecha a doca, 2 libera o pouso e F5 reinicia o alerta. Extraia o ZIP e abra FuelingFrontiers-Tempestade.exe. O pacote inclui instruções para a primeira partida."
      - name: Conferir o download público sem login
        run: |
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/demo-tempestade-0.13.1/FuelingFrontiers-Tempestade-Windows-x64.zip"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors "$url" -o /tmp/entrega-publica.zip
          cmp FuelingFrontiers-Tempestade-Windows-x64.zip /tmp/entrega-publica.zip
